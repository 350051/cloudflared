name: cloudflared test

on:
  workflow_dispatch:

concurrency:
  group: cloudflared-test
  cancel-in-progress: true

env:
  TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 260

    steps:
      # ---------- Get Latest Version ----------
      - name: Get latest versions
        id: versions
        shell: bash
        run: |
          CF_VERSION=$(curl -fsSL \
            https://api.github.com/repos/cloudflare/cloudflared/releases/latest \
            | jq -er '.tag_name | select(type == "string" and length > 0)') \
            || CF_VERSION="2026.7.0"

          echo "cloudflared=$CF_VERSION" >> "$GITHUB_OUTPUT"
          echo "Cloudflared version: $CF_VERSION"

      # ---------- Cache Cloudflared ----------
      - name: Cache cloudflared
        uses: actions/cache@v6
        with:
          path: ~/cloudflared
          key: cloudflared-${{ steps.versions.outputs.cloudflared }}

      # ---------- Start & Test Cloudflared ----------
      - name: Start & Test Cloudflared
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/cloudflared
          if [ ! -x ~/cloudflared/cloudflared ]; then
            VERSION="${{ steps.versions.outputs.cloudflared }}"
            wget -q \
              "https://github.com/cloudflare/cloudflared/releases/download/${VERSION}/cloudflared-linux-amd64" \
              -O ~/cloudflared/cloudflared
            chmod +x ~/cloudflared/cloudflared
          fi
          ~/cloudflared/cloudflared --version
          # Check Tunnel Token
          test -n "$TUNNEL_TOKEN" || {
            echo "ERROR: TUNNEL_TOKEN is empty"
            exit 1
          }
          # Optimize network buffers
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
          # Start Cloudflare Tunnel
          ~/cloudflared/cloudflared tunnel run 2>&1 \
            | sed -u -E 's/([[:alnum:]_-]+\.)+[[:alnum:]_-]+/***/g'
