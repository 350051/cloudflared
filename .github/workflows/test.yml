
name: cloudflared test

on:
  workflow_dispatch:

concurrency:
  group: cloudflared-test
  cancel-in-progress: true

env:
  TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
  ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 260

    steps:
      # ---------- Get Latest Versions ----------
      - name: Get latest versions
        id: versions
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${TUNNEL_TOKEN:-}" ]; then
            CF_VERSION=$(curl -fsSL \
              https://api.github.com/repos/cloudflare/cloudflared/releases/latest \
              | jq -er '.tag_name') || CF_VERSION="2026.11.0"
            echo "cloudflared=$CF_VERSION" >> "$GITHUB_OUTPUT"
            echo "Cloudflared: $CF_VERSION"
          else
            echo "WARNING: TUNNEL_TOKEN is empty. Skipping Cloudflared."
          fi
          if [ -n "${ACCESS_TOKEN:-}" ] && \
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              "https://warp-config.heatdeath.workers.dev/config" \
              -o "$RUNNER_TEMP/xray-config.json" && \
            jq -e 'type == "object"' \
              "$RUNNER_TEMP/xray-config.json" > /dev/null; then
            XRAY_VERSION=$(curl -fsSL --retry 3 \
              https://api.github.com/repos/XTLS/Xray-core/releases/latest \
              | jq -er '.tag_name') || XRAY_VERSION=""
            if [ -n "$XRAY_VERSION" ]; then
              echo "xray=$XRAY_VERSION" >> "$GITHUB_OUTPUT"
              echo "Xray-core: $XRAY_VERSION"
            else
              echo "WARNING: Failed to get Xray version. Skipping Xray."
            fi
          else
            echo "WARNING: Xray configuration unavailable. Skipping Xray."
          fi

      # ---------- Cache cloudflared ----------
      - name: Cache cloudflared
        if: steps.versions.outputs.cloudflared != ''
        uses: actions/cache@v6
        with:
          path: ~/cloudflared
          key: cloudflared-${{ steps.versions.outputs.cloudflared }}

      # ---------- Cache Xray-core ----------
      - name: Cache Xray-core
        if: steps.versions.outputs.xray != ''
        uses: actions/cache@v6
        with:
          path: ~/xray-core/bin
          key: xray-core-${{ steps.versions.outputs.xray }}

      # ---------- Download & Start ----------
      - name: Download & Start
        shell: bash
        run: |
          set -Eeuo pipefail
          # Configure UDP buffers
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
          # Download and start cloudflared
          if [ -n "${{ steps.versions.outputs.cloudflared }}" ]; then
            mkdir -p ~/cloudflared
            if [ ! -x ~/cloudflared/cloudflared ]; then
              VERSION="${{ steps.versions.outputs.cloudflared }}"
              wget -q \
                "https://github.com/cloudflare/cloudflared/releases/download/${VERSION}/cloudflared-linux-amd64" \
                -O ~/cloudflared/cloudflared
              chmod +x ~/cloudflared/cloudflared
            fi
            ~/cloudflared/cloudflared --version
          fi
          if [ -n "${{ steps.versions.outputs.xray }}" ]; then
            (
              set -Eeuo pipefail
              mkdir -p ~/xray-core/bin
              if [ ! -x ~/xray-core/bin/xray ]; then
                VERSION="${{ steps.versions.outputs.xray }}"
                curl -fsSL --retry 3 \
                  "https://github.com/XTLS/Xray-core/releases/download/${VERSION}/Xray-linux-64.zip" \
                  -o /tmp/xray-core.zip
                unzip -oq /tmp/xray-core.zip -d ~/xray-core/bin
                chmod +x ~/xray-core/bin/xray
                rm -f /tmp/xray-core.zip
              fi
              ~/xray-core/bin/xray version
              if ~/xray-core/bin/xray run -test \
                -config "$RUNNER_TEMP/xray-config.json"; then
                ~/xray-core/bin/xray run \
                  -config "$RUNNER_TEMP/xray-config.json" \
                  > "$RUNNER_TEMP/xray.log" 2>&1 &
                XRAY_PID=$!
                sleep 2
                if ! kill -0 "$XRAY_PID" 2>/dev/null; then
                  echo "WARNING: Xray-core failed to start."
                  tail -n 30 "$RUNNER_TEMP/xray.log"
                fi
              else
                echo "WARNING: Xray configuration validation failed."
              fi
            ) || echo "WARNING: Xray-core failed. Continuing with Cloudflared."
          fi
          # Start Cloudflare Tunnel
          if [ -n "${{ steps.versions.outputs.cloudflared }}" ]; then
            ~/cloudflared/cloudflared tunnel run 2>&1 \
              | sed -u -E 's/([[:alnum:]_-]+\.)+[[:alnum:]_-]+/***/g'
          else
            echo "Cloudflare Tunnel unavailable. Nothing to start."
          fi
