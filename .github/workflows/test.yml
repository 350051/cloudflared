name: cloudflared test

on:
  workflow_dispatch:

concurrency:
  group: cloudflared-test
  cancel-in-progress: true

env:
  TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
  ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 260

    steps:
      - name: Get latest versions
        id: versions
        shell: bash
        run: |
          set -uo pipefail
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
          if [ -n "${TUNNEL_TOKEN:-}" ]; then
            CF_VERSION=$(curl -fsSL --retry 3 \
              https://api.github.com/repos/cloudflare/cloudflared/releases/latest \
              | jq -er '.tag_name') || CF_VERSION="2026.11.0"
            echo "cloudflared=$CF_VERSION" >> "$GITHUB_OUTPUT"
            echo "Cloudflared: $CF_VERSION"
          else
            echo "WARNING: TUNNEL_TOKEN is empty. Skipping Cloudflared."
          fi
          if [ -n "${ACCESS_TOKEN:-}" ] && \
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              "https://xray-config.heatdeath.workers.dev/config" \
              -o "$RUNNER_TEMP/xray-config.json" && \
            jq -e 'type == "object" and
              any(.outbounds[]; .tag == "warp")' \
              "$RUNNER_TEMP/xray-config.json" > /dev/null; then
            echo "Base configuration downloaded."
            echo "Installing wireguard-tools..."
            if sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools; then
              echo "Generating WireGuard keys..."
              PRIVATE_KEY=$(wg genkey)
              PUBLIC_KEY=$(printf '%s' "$PRIVATE_KEY" | wg pubkey)
              echo "Registering WARP..."
              if INFO=$(curl -fsSL --retry 3 --max-time 30 \
                -X POST "https://api.cloudflareclient.com/v0a2158/reg" \
                -H "CF-Client-Version: a-7.21-0721" \
                -H "Content-Type: application/json" \
                -H "User-Agent: okhttp/3.12.1" \
                -H "Accept: */*" \
                -d "$(jq -n \
                  --arg key "$PUBLIC_KEY" \
                  --arg tos "$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")" \
                  '{key:$key,tos:$tos}')"); then
                if jq -e '
                  .config.interface.addresses.v4 and
                  .config.interface.addresses.v6 and
                  .config.peers[0].public_key and
                  .config.peers[0].endpoint.v4 and
                  .config.client_id
                ' <<< "$INFO" > /dev/null; then
                  echo "Generating reserved data..."
                  CLIENT_ID=$(jq -er '.config.client_id' <<< "$INFO")
                  RESERVED="[$(printf '%s' "$CLIENT_ID" \
                    | base64 -d | od -An -v -tu1 | xargs | tr ' ' ',')]"
                  echo "Merging WARP configuration..."
                  if jq --arg priv "$PRIVATE_KEY" \
                    --argjson info "$INFO" \
                    --argjson reserved "$RESERVED" '
                    (.outbounds[] | select(.tag == "warp")) = {
                      protocol: "wireguard",
                      settings: {
                        secretKey: $priv,
                        address: [
                          $info.config.interface.addresses.v4 + "/32",
                          $info.config.interface.addresses.v6 + "/128"
                        ],
                        peers: [{
                          publicKey: $info.config.peers[0].public_key,
                          allowedIPs: ["0.0.0.0/0", "::/0"],
                          endpoint: (
                            $info.config.peers[0].endpoint.v4 |
                            if endswith(":0") then .[:-2] + ":2408"
                            else .
                            end
                          ),
                          keepAlive: 25
                        }],
                        reserved: $reserved,
                        mtu: 1420,
                        domainStrategy: "ForceIP",
                        noKernelTun: true
                      },
                      tag: "warp"
                    }' "$RUNNER_TEMP/xray-config.json" \
                    > "$RUNNER_TEMP/xray-config.tmp" && \
                    mv "$RUNNER_TEMP/xray-config.tmp" \
                      "$RUNNER_TEMP/xray-config.json"; then
                    chmod 600 "$RUNNER_TEMP/xray-config.json"
                    echo "WARP registration and configuration completed."
                  else
                    echo "WARNING: WARP configuration merge failed. Using base configuration."
                  fi
                else
                  echo "WARNING: Invalid WARP registration response. Using base configuration."
                fi
              else
                echo "WARNING: WARP registration failed. Using base configuration."
              fi
            else
              echo "WARNING: Failed to install wireguard-tools. Skipping WARP."
            fi
            XRAY_VERSION=$(curl -fsSL --retry 3 \
              https://api.github.com/repos/XTLS/Xray-core/releases/latest \
              | jq -er '.tag_name') || XRAY_VERSION=""
            if [ -n "$XRAY_VERSION" ]; then
              echo "xray=$XRAY_VERSION" >> "$GITHUB_OUTPUT"
              echo "Xray-core: $XRAY_VERSION"
            else
              echo "WARNING: Failed to get Xray version. Skipping Xray."
            fi
          else
            echo "WARNING: Xray configuration unavailable. Skipping Xray."
          fi

      - name: Restore cloudflared cache
        id: cache_cloudflared
        if: steps.versions.outputs.cloudflared != ''
        uses: actions/cache/restore@v6
        with:
          path: ~/cloudflared
          key: cloudflared-${{ steps.versions.outputs.cloudflared }}

      - name: Restore Xray-core cache
        id: cache_xray
        if: steps.versions.outputs.xray != ''
        uses: actions/cache/restore@v6
        with:
          path: ~/xray-core/bin
          key: xray-core-${{ steps.versions.outputs.xray }}

      - name: Download Xray-core
        if: steps.versions.outputs.xray != '' && steps.cache_xray.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          XRAY_DIR="$HOME/xray-core"
          XRAY_BIN="$XRAY_DIR/bin/xray"
          mkdir -p "$XRAY_DIR/bin"
          if [ ! -x "$XRAY_BIN" ]; then
            VERSION="${{ steps.versions.outputs.xray }}"
            curl -fsSL --retry 3 \
              "https://github.com/XTLS/Xray-core/releases/download/${VERSION}/Xray-linux-64.zip" \
              -o /tmp/xray-core.zip
            unzip -oq /tmp/xray-core.zip -d "$XRAY_DIR/bin"
            chmod +x "$XRAY_BIN"
            rm -f /tmp/xray-core.zip
          fi
          "$XRAY_BIN" version

      - name: Save Xray-core cache
        if: steps.versions.outputs.xray != '' && steps.cache_xray.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/xray-core/bin
          key: xray-core-${{ steps.versions.outputs.xray }}

      - name: Configure & Start Xray-core
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${{ steps.versions.outputs.xray }}" ]; then
            echo "Xray-core unavailable. Skipping."
          else
            XRAY_DIR="$HOME/xray-core"
            XRAY_BIN="$XRAY_DIR/bin/xray"
            XRAY_CONFIG="$XRAY_DIR/config.json"
            XRAY_USER="$(id -un)"
            XRAY_GROUP="$(id -gn)"
            cp "$RUNNER_TEMP/xray-config.json" "$XRAY_CONFIG"
            chmod 600 "$XRAY_CONFIG"
            if "$XRAY_BIN" run -test -config "$XRAY_CONFIG" > /dev/null 2>&1; then
              sudo tee /etc/systemd/system/xray.service > /dev/null <<EOF
          [Unit]
          Description=Xray Core
          After=network.target
          StartLimitIntervalSec=0
          [Service]
          Type=simple
          User=$XRAY_USER
          Group=$XRAY_GROUP
          WorkingDirectory=$XRAY_DIR
          Environment=XRAY_LOCATION_ASSET=$XRAY_DIR/bin
          ExecStart=$XRAY_BIN run -config $XRAY_CONFIG
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          EOF
              sudo systemctl daemon-reload
              if ! sudo systemctl start xray; then
                echo "WARNING: Xray-core failed to start."
                sudo journalctl -u xray -n 30 --no-pager
              else
                sleep 2
                if ! sudo systemctl is-active --quiet xray; then
                  echo "WARNING: Xray-core failed to start."
                  sudo journalctl -u xray -n 30 --no-pager
                fi
              fi
            else
              echo "WARNING: Xray configuration validation failed."
            fi
          fi

      - name: Download cloudflared
        if: steps.versions.outputs.cloudflared != '' && steps.cache_cloudflared.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          CF_BIN="$HOME/cloudflared/cloudflared"
          mkdir -p "$HOME/cloudflared"
          if [ ! -x "$CF_BIN" ]; then
            VERSION="${{ steps.versions.outputs.cloudflared }}"
            curl -fsSL --retry 3 \
              "https://github.com/cloudflare/cloudflared/releases/download/${VERSION}/cloudflared-linux-amd64" \
              -o "$CF_BIN"
            chmod +x "$CF_BIN"
          fi
          "$CF_BIN" --version

      - name: Save cloudflared cache
        if: steps.versions.outputs.cloudflared != '' && steps.cache_cloudflared.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/cloudflared
          key: cloudflared-${{ steps.versions.outputs.cloudflared }}

      - name: Configure & Start cloudflared
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${{ steps.versions.outputs.cloudflared }}" ]; then
            echo "Cloudflare Tunnel unavailable. Nothing to start."
          else
            CF_BIN="$HOME/cloudflared/cloudflared"
            sudo tee /etc/systemd/system/cloudflared.service > /dev/null <<EOF
          [Unit]
          Description=cloudflared
          After=network-online.target
          Wants=network-online.target
          [Service]
          TimeoutStartSec=15
          Type=notify
          ExecStart=$CF_BIN --no-autoupdate tunnel run --token $TUNNEL_TOKEN
          Restart=on-failure
          RestartSec=5s
          [Install]
          WantedBy=multi-user.target
          EOF
            sudo chmod 600 /etc/systemd/system/cloudflared.service
            sudo systemctl daemon-reload
            if ! sudo systemctl start cloudflared || \
              ! sudo systemctl is-active --quiet cloudflared; then
              echo "WARNING: Cloudflare Tunnel failed to start."
              sudo journalctl -u cloudflared -n 30 --no-pager
              exit 1
            fi
            sudo journalctl -fu cloudflared \
              | sed -u -E 's/([[:alnum:]_-]+\.)+[[:alnum:]_-]+/***/g'
          fi
